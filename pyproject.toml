[project]
name = "cvextractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "varshakarthikeyan28", email = "varsharsk28@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
]

[project.scripts]
cvextractor = "cvextractor:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
